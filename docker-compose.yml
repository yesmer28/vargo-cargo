services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-vargo_cargo}
    volumes:
      # PRODUCCIÓN: volumen EXTERNAL — Compose no lo crea ni lo recrea.
      # NUNCA: docker compose down -v | docker volume rm | recreate
      - postgres_data:/var/lib/postgresql/data
    # Acceso desde el host (Django fuera de Docker). En red interna el host es `db`.
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vargo_cargo}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vargo_cargo_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-vargo_cargo}
      # NUNCA true en producción con datos reales (puede alterar esquema)
      DB_SYNC: ${DB_SYNC:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://vargocargo.com,https://www.vargocargo.com}
    ports:
      - "5000:5000"
    networks:
      - vargo_cargo_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_URL: ${API_URL:-http://backend:5000}
    ports:
      - "3000:3000"
    networks:
      - vargo_cargo_net

# Volumen ya existente. Compose solo lo monta; no lo crea ni lo borra.
# Si no existe (servidor nuevo, una sola vez):
#   docker volume create --driver local \
#     --opt type=none --opt o=bind \
#     --opt device="$(pwd)/docker-data/postgres" \
#     vargo_cargo_postgres_data
volumes:
  postgres_data:
    external: true
    name: vargo_cargo_postgres_data

# Red compartida con el sistema Django (../sistema)
networks:
  vargo_cargo_net:
    name: vargo_cargo_net
    driver: bridge
